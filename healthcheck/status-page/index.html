<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Transcendence Status</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    h1 { text-align: center; }
    .service { margin: 10px 0; padding: 10px; border-radius: 5px; width: 300px; }
    .ok { background-color: #d4edda; color: #155724; }
    .down { background-color: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <h1>Transcendence Services Status</h1>
  <div id="services"></div>

  <script>
    async function fetchStatus() {
      try {
        const res = await fetch('/health/');
        const data = await res.json();
        const container = document.getElementById('services');
        container.innerHTML = '';
        for (const [service, status] of Object.entries(data)) {
          const div = document.createElement('div');
          div.className = 'service ' + (status === 'ok' ? 'ok' : 'down');
          div.textContent = `${service}: ${status}`;
          container.appendChild(div);
        }
      } catch (err) {
        console.error('Failed to fetch status', err);
      }
    }

    fetchStatus();
    setInterval(fetchStatus, 5000); // refresh every 5 seconds
  </script>
</body>
</html>
