<!DOCTYPE html>
<html>
<head>
    <title>Multiplayer Ping Pong</title>
    <style>
        body { background: #d4c926; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        canvas { background: #000; border: 4px solid #444; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        #info { margin: 10px; font-size: 1.2rem; }
        .side-left { color: #0ca909; }
        .side-right { color: #1815b1; }
    </style>
</head>
<body>
    <h1>Pong Test</h1>
    <div id="info">Connecting...</div>
    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const info = document.getElementById('info');
        
        // Match this to your server port
        const socket = new WebSocket('ws://localhost:3010');

        let mySide = null;
        let gameState = null;

        socket.onmessage = (event) => {
            const msg = JSON.parse(event.data);

            if (msg.type === 'waiting') {
                info.innerText = "Waiting for an opponent...";
            }

            if (msg.type === 'role') {
                mySide = msg.side;
                info.innerHTML = `You are the <b class="side-${mySide}">${mySide}</b> player`;
            }

            if (msg.type === 'state') {
                gameState = msg.payload;
                draw();
            }

            if (msg.type === 'opponent_disconnected') {
                info.innerText = "Opponent left. Please refresh.";
            }
        };

        function draw() {
            if (!gameState) return;

            // Clear Screen
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Center Line
            ctx.strokeStyle = "#333";
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();

            // Draw Paddles
            ctx.setLineDash([]);
            ctx.fillStyle = "#3498db"; // Left Blue
            ctx.fillRect(20, gameState.left.y, 12, 90);

            ctx.fillStyle = "#e74c3c"; // Right Red
            ctx.fillRect(canvas.width - 20 - 12, gameState.right.y, 12, 90);

            // Draw Ball
            ctx.fillStyle = "white";
            ctx.beginPath();
            ctx.arc(gameState.ball.x, gameState.ball.y, 8, 0, Math.PI * 2);
            ctx.fill();

            // Draw Scores
            ctx.font = "30px Monospace";
            ctx.fillText(gameState.left.score, canvas.width / 4, 50);
            ctx.fillText(gameState.right.score, (canvas.width / 4) * 3, 50);
        }

        // Handle Keys
        const handleKey = (e, isPressed) => {
    let keyToSend = null;
    const k = e.key;

    // Allow all keys regardless of which "side" the browser thinks it is
    if (k === 'w' || k === 's' || k === 'ArrowUp' || k === 'ArrowDown') {
        keyToSend = k;
    }

    if (keyToSend && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({
            type: 'key',
            key: keyToSend,
            pressed: isPressed
        }));
    }
};

        window.addEventListener('keydown', (e) => handleKey(e, true));
        window.addEventListener('keyup', (e) => handleKey(e, false));
    </script>
</body>
</html>
