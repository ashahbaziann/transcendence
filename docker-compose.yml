services:

  # Reverse proxy / entry point
  nginx:
    container_name: nginx
    build: ./nginx
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - frontend
      - gateway
      - service-checker
      - status-page
      - grafana
    networks:
      - transcendence-net

  # Frontend
  frontend:
    container_name: frontend
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - transcendence-net
    command: npm run dev

  # Gateway API
  gateway:
    container_name: gateway
    build: ./backend/gateway
    ports:
      - "3005:3005"
    networks:
      - transcendence-net

  # Auth service
  auth-service:
    container_name: auth-service
    build: ./backend/auth-service
    env_file:
      - ./backend/auth-service/.env
    ports:
      - "3001:3000"
    volumes:
      - ./backend/auth-service:/app    # ← добавить эту строку
      - /app/node_modules
    networks:
      - transcendence-net

  # User service
  user-service:
    container_name: user-service
    build: ./backend/user-service
    ports:
      - "3002:3000"
    networks:
      - transcendence-net

  # Game service
  game-service:
    container_name: game-service
    build: ./backend/game-service
    ports:
      - "3003:3000"
    networks:
      - transcendence-net
  

  game-standalone:
    container_name: game-standalone
    build: ./backend/game-standalone
    ports:
      - "3010:3010"
    networks:
      - transcendence-net

  # Health system
  service-checker:
    container_name: service-checker
    build: ./healthcheck/service-checker
    ports:
      - "4000:4000"
    networks:
      - transcendence-net

  status-page:
    container_name: status-page
    build: ./healthcheck/status-page
    ports:
      - "3007:3000"
    networks:
      - transcendence-net

  # Database
  postgres:
    container_name: postgres
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - transcendence-net

  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    networks:
      - transcendence-net
    depends_on:
      - auth-service
      - user-service
      - game-service
      - gateway

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=${GF_USERS_ALLOW_SIGN_UP}
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL}
      - GF_SERVER_SERVE_FROM_SUB_PATH=${GF_SERVER_SERVE_FROM_SUB_PATH}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards
      - grafana_data:/var/lib/grafana

    networks:
      - transcendence-net
    depends_on:
      - prometheus

# Custom network for all services
networks:
  transcendence-net:
    driver: bridge

# Persistent volume for database
volumes:
  postgres_data:
  grafana_data: