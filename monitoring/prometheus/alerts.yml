groups:
  - name: transcendence
    rules:
      - alert: ServiceDown
        expr: up{job="services"} == 0
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.instance }} is down"

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes{job="services"} > 150000000
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "High memory on {{ $labels.instance }}"

      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total{job="services"}[1m]) > 0.8
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "High CPU on {{ $labels.instance }}"
