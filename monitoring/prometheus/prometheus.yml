global:
  scrape_interval: 5s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'services'
    static_configs:
      - targets:
          - auth-service:3000
          - user-service:3000
          - game-service:3000
          - gateway:3005

  - job_name: 'prometheus'
    static_configs:
      - targets:
          - localhost:9090
